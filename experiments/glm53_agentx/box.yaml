# The model disk is node-local LVM, so every pod using it is pinned to that node.
# `box` is a CPU pod for downloads and for fetching results. See run.yaml and nsight.yaml for the GPU pods.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: __PREFIX__-models
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: __STORAGE_CLASS__
  resources: {requests: {storage: 500Gi}}
---
apiVersion: v1
kind: Pod
metadata:
  name: __PREFIX__-box
spec:
  nodeSelector: {kubernetes.io/hostname: __NODE__}
  restartPolicy: Never
  activeDeadlineSeconds: 172800
  containers:
  - name: main
    image: docker.io/vllm/vllm-openai:nightly
    command: ["sleep", "infinity"]
    securityContext: {allowPrivilegeEscalation: false}
    env:
    - {name: HOME, value: /models/home}
    - {name: HF_HOME, value: /models/hf}
    resources:
      limits: {cpu: "16", memory: 64Gi}
      requests: {cpu: "16", memory: 64Gi}
    volumeMounts: [{name: models, mountPath: /models}, {name: scripts, mountPath: /scripts}]
  volumes:
  - {name: models, persistentVolumeClaim: {claimName: __PREFIX__-models}}
  - {name: scripts, configMap: {name: __PREFIX__-scripts}}
