# GPU pod for one AgentX point (run.sh). It holds the 4 GPUs until the script exits.
# The model disk is node-local, so the pod is pinned to its node (see box.yaml).
apiVersion: v1
kind: Pod
metadata:
  name: __PREFIX__-run-__RUN_ID__
  labels: {app: __PREFIX__-run}
spec:
  nodeSelector: {kubernetes.io/hostname: __NODE__}
  restartPolicy: Never
  activeDeadlineSeconds: __DEADLINE__
  containers:
  - name: main
    image: docker.io/vllm/vllm-openai:nightly
    imagePullPolicy: Always  # the node caches an old nightly otherwise
    command: ["bash", "/scripts/run.sh"]
    securityContext: {allowPrivilegeEscalation: false}
    env:
    - {name: HOME, value: /models/home}
    - {name: HF_HOME, value: /models/hf}
    - {name: NVIDIA_VISIBLE_DEVICES, value: all}
    - {name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility"}
    - {name: RUN_ID, value: "__RUN_ID__"}
    - {name: CONC, value: "__CONC__"}
    - {name: DURATION, value: "__DURATION__"}
    - {name: WARMUP, value: "__WARMUP__"}
    - {name: OFFLOAD_GIB_PER_RANK, value: "__OFFLOAD__"}
    resources:
      limits: {nvidia.com/gpu: 4, cpu: "64", memory: __MEM__}
      requests: {nvidia.com/gpu: 4, cpu: "64", memory: __MEM__}
    volumeMounts:
    - {name: models, mountPath: /models}
    - {name: scripts, mountPath: /scripts}
    - {name: shm, mountPath: /dev/shm}
  volumes:
  - {name: models, persistentVolumeClaim: {claimName: __PREFIX__-models}}
  - {name: scripts, configMap: {name: __PREFIX__-scripts}}
  - {name: shm, emptyDir: {medium: Memory, sizeLimit: 64Gi}}
