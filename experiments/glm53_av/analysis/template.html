<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@TITLE@@</title>
<style>@@THEME@@
#throughput-table:checked~.metric-tabs label[for="throughput-table"],#accuracy-table:checked~.metric-tabs label[for="accuracy-table"],#al-table:checked~.metric-tabs label[for="al-table"]{background:#235cca;color:white}
#throughput-table:checked~.panels #throughput-panel,#accuracy-table:checked~.panels #accuracy-panel,#al-table:checked~.panels #al-panel{display:block}
#throughput-table:focus-visible~.metric-tabs label[for="throughput-table"],#accuracy-table:focus-visible~.metric-tabs label[for="accuracy-table"],#al-table:focus-visible~.metric-tabs label[for="al-table"]{outline:3px solid #e4ad31;outline-offset:3px}
</style></head><body>
<h1>@@HEADING@@</h1>
<p class="subtitle">@@SUBTITLE@@</p>
<p>@@MODELS@@</p>
@@NOTE@@
<section class="card"><figure aria-label="Throughput versus interactivity">@@PARETO_MEAN@@<figcaption>@@CAPTION@@</figcaption></figure></section>
<section class="card"><h2>Results</h2>
<input class="metric-choice" type="radio" name="table" id="throughput-table" checked aria-controls="throughput-panel">
<input class="metric-choice" type="radio" name="table" id="accuracy-table" aria-controls="accuracy-panel">
<input class="metric-choice" type="radio" name="table" id="al-table" aria-controls="al-panel">
<div class="metric-tabs"><label for="throughput-table">Throughput (output tokens/sec)</label><label for="accuracy-table">@@SECONDARY_LABEL@@</label><label for="al-table">AL</label></div>
<div class="panels">
<section class="tab-panel" id="throughput-panel"><div class="table-scroll"><table><thead><tr><th>Bsz</th>@@METHOD_HEADERS@@</tr></thead><tbody>@@THROUGHPUT_TABLE@@</tbody></table></div></section>
<section class="tab-panel" id="accuracy-panel"><div class="table-scroll"><table><thead><tr><th>Bsz</th>@@METHOD_HEADERS@@</tr></thead><tbody>@@ACCURACY_TABLE@@</tbody></table></div></section>
<section class="tab-panel" id="al-panel"><div class="table-scroll"><table><thead><tr><th>Bsz</th>@@METHOD_HEADERS@@</tr></thead><tbody>@@AL_TABLE@@</tbody></table></div></section>
</div></section>
<p><a href="benchmark-logs.html">Benchmark and server logs</a> · <a href="benchmark-logs.tar.gz" download>Download all logs and raw results</a></p>
</body></html>
