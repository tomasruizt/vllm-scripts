apiVersion: v1
kind: Pod
metadata:
  name: sm120-v131k
  namespace: runtime
spec:
  nodeName: lenovo-sr675v3-01.khw.eng.bos2.dc.redhat.com
  restartPolicy: Never
  activeDeadlineSeconds: 10800
  containers:
  - name: main
    image: docker.io/vllm/vllm-openai:nightly-1648fefab91204f3b15bf8062217316f07f2c4bb
    command: ["sleep", "infinity"]
    resources:
      limits: {nvidia.com/gpu: 1, cpu: "16", memory: 64Gi}
      requests: {nvidia.com/gpu: 1, cpu: "16", memory: 64Gi}
    volumeMounts: [{name: work, mountPath: /tmp/work}, {name: shm, mountPath: /dev/shm}]
  volumes:
  - {name: work, emptyDir: {}}
  - {name: shm, emptyDir: {medium: Memory, sizeLimit: 8Gi}}
