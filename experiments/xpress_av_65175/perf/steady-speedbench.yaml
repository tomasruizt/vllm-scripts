# Template rendered by run-steady.sh: __PORT__ is replaced per GPU.
# AIPerf owns the workload: the concurrency grid is a sweep and the repeats are
# multi_run trials, so one invocation per (GPU, mode) covers every cell.
# Duration-bounded so a cell's wall-clock does not depend on the variant's speed, and
# the grace period lets every in-flight request finish, so nothing is cancelled.
schemaVersion: "2.0"
randomSeed: 42
sweep:
  type: grid
  parameters:
    phases.profiling.concurrency: [1, 8, 32, 64, 128]
multi_run:
  num_runs: 3
  cooldown_seconds: 5
benchmark:
  model: qwen
  endpoint:
    url: http://127.0.0.1:__PORT__
    type: chat
    streaming: true
    use_server_token_count: true
    timeout: 600
    extra:
      temperature: 0
      ignore_eos: false
      min_tokens: 0
      max_completion_tokens: 1024
      chat_template_kwargs:
        enable_thinking: false
  tokenizer:
    name: /mnt/nfs-preprod-1/engine/hub_cache/models--Qwen--Qwen3-8B/snapshots/b968826d9c46dd6066d109eabc6255188de91218
  datasets:
    - name: main
      type: file
      path: /data/tomasruizt/benchmarks/speed-bench/throughput_1k.jsonl
      format: speed_bench_throughput_1k
      sampling: shuffle
      random_seed: 42
  phases:
    - name: profiling
      type: concurrency
      duration: 30
      grace_period: 30
      concurrency: 1
  server_metrics:
    enabled: true
    urls: [http://127.0.0.1:__PORT__/metrics]
    formats: [json]
  artifacts:
    dir: ${QUICK_ARTIFACTS}
    summary: [json]
    records: [jsonl]
    raw: true
    export_outputs_json: true
  runtime:
    ui: none
